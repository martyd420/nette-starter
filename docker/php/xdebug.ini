; Xdebug is off by default. Enable per-run from docker-compose by exporting
; XDEBUG_MODE (e.g. `XDEBUG_MODE=debug docker compose up`); Xdebug reads that
; environment variable natively and it overrides the value below.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
